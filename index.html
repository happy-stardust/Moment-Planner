<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Goal Planner - Weekly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  
  <style>
    :root {
      --primary-color: #8b9bb4;
      --accent-color: #e58b88;
      --border-color: #e2e8f0;
      --line-color: #f1f5f9;
      --text-main: #334155;
      --text-muted: #94a3b8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --row-height: 34px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
      /* 아이패드에서 텍스트 선택 방지 (드래그 편의성) */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .planner-container {
      width: 100%;
      max-width: 1240px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      padding: 32px 36px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Navigation & Header */
    .planner-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 16px;
    }

    .title-group {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .title-group h1 {
      font-size: 1.45rem;
      font-weight: 500;
      color: var(--primary-color);
      letter-spacing: -0.5px;
    }

    .title-group span {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .nav-tabs {
      display: flex;
      gap: 18px;
    }

    .nav-tab {
      font-size: 0.85rem;
      color: #cbd5e1;
      text-decoration: none;
      cursor: pointer;
      padding-bottom: 4px;
      transition: all 0.2s;
    }

    .nav-tab.active {
      color: var(--accent-color);
      font-weight: 600;
      border-bottom: 2px solid var(--accent-color);
    }

    /* Sub-bar */
    .sub-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .month-list, .week-list {
      display: flex;
      gap: 10px;
